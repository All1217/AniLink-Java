server:
  port: 8022
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.web.main.mapper: debug

video:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    accessKey: ${MINIO_ACCESSKEY}
    secretKey: ${MINIO_SECRETKEY}

netty:
  port: 5051
